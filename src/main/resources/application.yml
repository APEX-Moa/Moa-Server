# ============================================================
# Moa 백엔드 기본 설정 (dev 프로파일)
#   - 아무 프로파일도 지정하지 않으면 이 설정이 적용됩니다.
#   - 로컬 Docker Postgres를 사용합니다 (H2 사용 안 함).
#     사전에 아래 명령으로 컨테이너를 띄워두세요:
#     docker run --name moa-postgres -e POSTGRES_USER=moa -e POSTGRES_PASSWORD=moa1234 -e POSTGRES_DB=moa -p 5432:5432 -d postgres:16
#   - 운영은 application-prod.yml 참고 (환경변수로 다른 Postgres 접속)
# ============================================================
spring:
  application:
    name: moa-backend

  # --- 로컬 Postgres (Docker) ---
  datasource:
    url: jdbc:postgresql://localhost:5432/moa
    driver-class-name: org.postgresql.Driver
    username: moa
    password: moa1234

  jpa:
    hibernate:
      ddl-auto: update            # 개발 편의를 위해 엔티티 기준으로 스키마 자동 생성/갱신
    open-in-view: false           # 지연로딩으로 인한 예기치 않은 쿼리 방지 (권장)
    properties:
      hibernate:
        format_sql: true
    show-sql: true                # 로컬에서는 쿼리 로그를 보면서 테스트

server:
  port: 8080

# ============================================================
# Moa 커스텀 설정 (MoaProperties 로 바인딩)
# ============================================================
moa:
  school-name: 광주소프트웨어마이스터고
  jwt:
    # 개발용 기본 시크릿(길게). 운영에서는 반드시 환경변수로 덮어쓰세요.
    #   예) MOA_JWT_SECRET=... 또는 moa.jwt.secret=...
    secret: moa-dev-secret-please-change-this-to-a-long-random-value-at-least-64-bytes-1234567890
    expiry-hours: 12
  # 야자 교시 정의. time 형식은 "HH:MM – HH:MM" (en dash) 로 통일 → 출석 시간 판정에 사용
  periods:
    - id: p1
      label: 야자 1교시
      time: "18:30 – 20:00"
    - id: p2
      label: 야자 2교시
      time: "20:10 – 21:40"

logging:
  level:
    kr.moa: INFO
