# ============================================================
# Moa 백엔드 운영(prod) 설정 — PostgreSQL
#   실행: ./mvnw spring-boot:run --spring.profiles.active=prod
#   또는: java -jar moa-backend.jar --spring.profiles.active=prod
#
# 300명 동시 접속 튜닝 메모:
#   - 인증은 JWT 기반 stateless 이므로 서버가 세션을 들고 있지 않음 → 수평 확장 용이
#   - Tomcat 기본 max-threads=200 로도 충분 (요청이 짧고 대부분 DB I/O)
#   - DB 커넥션 풀(Hikari)이 병목이 되지 않도록 pool-size 를 30 정도로 확보
#   - 커넥션은 CPU/코어 대비 과도하면 오히려 느려지므로 30 내외가 적정
# ============================================================
spring:
  datasource:
    # 환경변수로 주입: DB_URL / DB_USER / DB_PASSWORD
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30       # 동시 접속 대비 커넥션 상한
      minimum-idle: 5             # 유휴 상태에서도 최소 유지할 커넥션
      connection-timeout: 20000   # 커넥션 획득 대기 최대 20초

  jpa:
    hibernate:
      # 운영에서는 스키마를 함부로 바꾸지 않도록 validate 권장(마이그레이션 도구 별도 사용 시).
      # 초기 도입 단계라면 update 로 바꿔도 됨.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  h2:
    console:
      enabled: false              # 운영에서는 반드시 비활성화

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 200                    # 기본값. 필요 시 상향

moa:
  # 운영 시크릿은 반드시 환경변수(MOA_JWT_SECRET)로 주입하세요.
  jwt:
    secret: ${MOA_JWT_SECRET}

logging:
  level:
    kr.moa: INFO
